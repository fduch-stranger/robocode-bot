<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robocode Telemetry</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101828'/%3E%3Cpath d='M7 19h18v5H7zM10 11h9v5h-9zM19 13h6v2h-6z' fill='%235ed4ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brandMark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06121f" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="8" rx="2"/><path d="M9 11V8h6v3M15 9.5h5"/></svg>
      </div>
      <div>
        <h1>Robocode Telemetry</h1>
        <p id="source">Waiting for telemetry...</p>
      </div>
    </div>
    <div class="status">
      <span id="liveChip" class="chip liveChip"><span class="dot"></span><span id="liveLabel">waiting</span></span>
      <span id="turnChip" class="chip">turn -</span>
      <span id="eventCount" class="chip">0 events</span>
      <span id="lastUpdate" class="chip">never</span>
      <button id="resetTelemetry" class="dangerButton" type="button">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="arenaPanel">
      <div class="panelHeader">
        <h2>Arena</h2>
        <div id="botTabs" class="tabs"></div>
        <label class="tabToggle"><input id="showInactiveBots" type="checkbox"> inactive</label>
      </div>
      <canvas id="arena" width="920" height="620"></canvas>
      <div class="legend">
        <span><i style="background:#5ad6ff"></i>enemy wave on the selected bot</span>
        <span><i style="background:#f2bf62"></i>bullet</span>
        <span><i style="background:rgba(242,191,98,0.7)"></i>aim point</span>
        <span><i style="background:rgba(90,176,255,0.45)"></i>radar</span>
      </div>
    </section>

    <section class="sidePanel">
      <div class="panelHeader">
        <h2>Selected Bot</h2>
        <span id="selectedBot" class="pill">none</span>
      </div>
      <div id="metrics" class="metrics"></div>
      <div id="surfCard" class="surfCard" hidden></div>
      <div class="chartBlock">
        <h3>Energy</h3>
        <canvas id="energyChart" width="520" height="120"></canvas>
      </div>
      <div class="chartBlock">
        <h3>Target Distance</h3>
        <canvas id="distanceChart" width="520" height="120"></canvas>
      </div>
    </section>

    <section class="widePanel analysisPanel">
      <div class="panelHeader">
        <h2>Performance</h2>
        <span class="pill">derived from events</span>
      </div>
      <div id="performanceGrid" class="performanceGrid"></div>
      <div class="timelineGrid">
        <div class="chartBlock">
          <h3>Gun Mode Timeline</h3>
          <canvas id="gunTimeline" width="900" height="96"></canvas>
        </div>
        <div class="chartBlock">
          <h3>Movement Timeline</h3>
          <canvas id="movementTimeline" width="900" height="96"></canvas>
        </div>
      </div>
    </section>

    <section class="widePanel">
      <div class="panelHeader">
        <h2>Decision Stream</h2>
        <div class="filters">
          <label>
            <span>type</span>
            <select id="eventFilter" aria-label="Event type filter">
              <option value="all">All events</option>
              <option value="gun">Gun events</option>
              <option value="gun-switch">Gun switches</option>
              <option value="movement">Movement</option>
              <option value="targeting">Targeting</option>
              <option value="combat">Combat</option>
              <option value="telemetry">Telemetry</option>
            </select>
          </label>
          <label><input id="onlySelected" type="checkbox" checked> selected</label>
          <label><input id="showSamples" type="checkbox" checked> samples</label>
        </div>
      </div>
      <div id="events" class="events"></div>
    </section>
  </main>

  <script src="/formatters.js"></script>
  <script src="/app.js"></script>
</body>
</html>
